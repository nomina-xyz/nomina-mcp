name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python scripts/build_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nomina.mcpb
          path: dist/Nomina.mcpb
