# Fly.io deployment for the Streamable HTTP server.
#   fly launch --copy-config --no-deploy   (once; creates the app)
#   fly secrets set PUBLIC_HOST=mcp.nomina.io
#   fly deploy
#   fly certs add mcp.nomina.io           (then CNAME mcp.nomina.io -> <app>.fly.dev)
app = "nomina-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
