# Render blueprint: Dashboard -> New -> Blueprint -> this repository.
# Free plan sleeps after 15 idle minutes (about a minute to wake); a paid plan removes that.
services:
  - type: web
    name: nomina-mcp
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    # Render's RENDER_EXTERNAL_HOSTNAME is always accepted; PUBLIC_HOST adds custom domains
    # (comma-separated). Attach the domain in Render (Settings -> Custom Domains) and point a
    # CNAME at nomina-mcp.onrender.com.
    envVars:
      - key: PUBLIC_HOST
        value: mcp.nomina.io
